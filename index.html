<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Juego de Parejas</title>
    <script src="main.js" defer></script>
    <link href="style.css" rel="stylesheet">
</head>

<body class="dark">

    <header class="alpine">
        <h1>JUEGO DE PAREJAS</h1>

        <h3>EMPAREJA TODAS LAS IMÁGENES PARA DESBLOQUEAR INFORMACIÓN</h>
    </header>

    <main class="game alpine">

        <section class="game-controls">

            <div class="difficulty">
                <span>Dificultad</span>

                <div class="difficulty-options">
                    <button class="difficulty-option">Fácil</button>
                    <button class="difficulty-option">Media</button>
                    <button class="difficulty-option">Difícil</button>
                </div>
            </div>

            <button class="play-button">▶ PLAY</button>

            <div class="game-info">
                <div>
                    <span class="info-label">TIEMPO</span>
                    <span class="tiempo">00:00</span>
                </div>

                <div>
                    <span class="info-label">SCORE</span>
                    <span class="score">0000</span>
                </div>
            </div>

        </section>


        <section class="board">
            
        
        </section>

    </main>
</body>

</html>
